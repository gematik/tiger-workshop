tigerProxy:
  skipTrafficEndpointsSubscription: false
  keyFolders:
    - .

servers:
  zionServer:
    type: zion
    zionConfiguration:
      serverPort: 8090
      mockResponses:
        helloWorld:
          requestCriterions:
            - message.method == 'GET'
            - message.path == '/helloWorld'
          response:
            statusCode: 200
            body: 'hello world'
        healthCheck:
          request:
            method: "GET"
            path: "/healthcheck"
          response:
            statusCode: 200
            body: 'healthcheck is okay'
        passwordCheck:
          requestCriterions:
            - message.method == 'POST'
            - message.path == '/checkPassword'
          nestedResponses:
            correctPassword:
              importance: 20
              requestCriterions:
                - $.body == 'secret'
              response:
                statusCode: ${responseStatusCode}
                body: 'login correct'
            wrongPassword:
              importance: 5
              response:
                statusCode: 400
                body: 'login incorrect'

  otherZionServer:
    type: zion
    zionConfiguration:
      serverPort: ${free.port.1}
      mockResponses:
          users:
            request:
              path: "/users/{userId}"
              method: "GET"
              additionalCriterions:
                - "'${userId}' == '123'"
            response:
              statusCode: 200
              body: "{'id':'${userId}', 'username': 'Tiger'}"

  anotherZionServer:
    type: zion
    zionConfiguration:
      serverPort: ${free.port.2}
      mockResponses:
        someGetEndpoint:
          requestCriterions:
            - message.method == 'GET'
            - message.path == '/abc'
          nestedResponses:
            regularResponse:
              response:
                statusCode: ${responseStatusCode|200}
                body: ${responseBody|}
        somePostEndpoint:
          requestCriterions:
            - message.method == 'POST'
            - message.path == '/efg'
          nestedResponses:
            regularResponse:
              response:
                statusCode: ${responseStatusCode|200}
                headers:
                  Content-Type: ${contentType|}
                  Transfer-Encoding: ${transferEncoding|}
                  Connection: ${connectionFlag|}
                  Retry-After: ${afterRetry|}
                body: ${responseBody|}
                encoding: ${contentEncoding|}
                responseDelay: ${delayResponse|0}

lib:
  rbelPathDebugging: false
  activateWorkflowUi: true
  httpClientConfig:
    activateRbelWriter: true
  